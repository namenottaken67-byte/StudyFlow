<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>

    <style>
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 2rem;
            background-color: #044309;
            color: #f7f6f6;
        }

        .hero {
            height: 50vh;
            background-image: linear-gradient(rgba(81, 77, 77, 0.5), rgba(3, 3, 3, 0.5)), url('background2.jpg');
            background-size: contain;
            background-color: #f8f6f600;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .hero h1 {
            font-size: 2rem;
            color: #edf0ee;
        }

        nav a {
            color:#fcfdfc;
        }

        nav ul {
            list-style: none;
            display: flex;
            gap: 1rem;
        }
    </style>
</head>
<body>

    <nav>
        <div>Dashboard</div>
        <ul>
            <li><a href="StudyPlanner.html">Study Planner</a></li>
        </ul>
        <ul>
            <li><a href="StudySession.html">Study Session</a></li>
        </ul>
    </nav>

    <section class="hero">
        <h1>Welcome to StudyFlow.</h1>
    </section>

    <h2>My Progress</h2>
    <p id="taskscompleted"></p>
    

    <h2>Next Task(s)</h2>
    <p id="notasks">You have no tasks yet.</p>
    <ul id="listoftasks"></ul>

    <script>
        const listinDashboard = document.getElementById('listoftasks');
        const storedstuff = JSON.parse(localStorage.getItem('tasks2')) || [];
        console.log("Saved tasks:", storedstuff);
        const tasksdone = storedstuff.filter(function (task) {
            console.log(task.name, task.completed);
            return task.completed === true;
        })

        const finishedCount = document.getElementById('taskscompleted');
        finishedCount.textContent = "Tasks completed: " + tasksdone.length;

        console.log("Assignments completed:", tasksdone.length);

        const nomessage = document.getElementById('notasks');

        const thisday = new Date();
        const thisdaystring = thisday.getFullYear() + '-' + String(thisday.getMonth() + 1).padStart(2, '0') + '-' + String(thisday.getDate()).padStart(2, '0');

        const nextassignments = storedstuff.filter(function (task) {
            console.log("Deadline:", task.deadline);
            console.log("Today:", thisdaystring);
            console.log("Comparison:", task.deadline >= thisdaystring);

            return task.deadline >= thisdaystring && task.completed === false;
        });

        nextassignments.sort(function (c, d) {
            return c.deadline.localeCompare(d.deadline);
        });

        for (let task of nextassignments.slice(0, 3)) {
            const stuff = document.createElement('li');
            stuff.textContent = task.name + " - " + task.class + " - " + task.deadline + " - " + task.importance;
            listinDashboard.appendChild(stuff);
        }

        if (nextassignments.length == 0) {
            nomessage.style.display = 'block';
        } else {
            nomessage.style.display = 'none';
        }

    </script>
    
</body>
</html>
